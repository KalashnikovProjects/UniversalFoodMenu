ktor {
  deployment {
    port = 8080
    port = ${?KTOR_INNER_PORT}
  }
  application {
    modules = [
      com.kalashnikovprojects.ufmserver.plugins.KoinKt.configureKoin
      com.kalashnikovprojects.ufmserver.plugins.SerializationKt.configureSerialization
      com.kalashnikovprojects.ufmserver.plugins.SecurityKt.configureSecurity
      com.kalashnikovprojects.ufmserver.plugins.ExposedKt.configureExposed
      com.kalashnikovprojects.ufmserver.plugins.RoutingKt.configureRouting
    ]
  }
}
jwt {
    domain = "UFM"
    realm = "universal food menu"
    secret = ${JWT_SECRET}
}

db {
    host = "ufm-db:5432",
    host = ${?POSTGRES_HOST},
    name = ${POSTGRES_DB},
    user = ${POSTGRES_USER},
    password = ${POSTGRES_PASSWORD},
}