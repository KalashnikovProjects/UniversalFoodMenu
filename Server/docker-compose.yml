services:
  ufm-server:
    volumes:
      - ufm-static:/static
    build: .
    ports:
      - "8096:8080"
    environment:
      SERVER_HOST:
        localhost:8096
      POSTGRES_HOST:
        ufm-db:5432
    env_file:
      - stack.env  # POSTGRES_DB, POSTGRES_USER, POSTGRES_PASSWORD
    depends_on:
      ufm-db:
        condition: service_healthy
    restart: unless-stopped

  ufm-db:
    image: postgres
    volumes:
      - postgres_volume:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ufm_db
    env_file:
      - stack.env  # POSTGRES_DB, POSTGRES_USER, POSTGRES_PASSWORD
    ports:
      - "5435:5432"
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_volume:
  ufm-static: